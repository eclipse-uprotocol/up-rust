[package]
categories = ["api-bindings"]
description = "The Eclipse uProtocol Rust Language Library"
edition = "2021"
include = [
    "/abi/*",
    "/build.rs",
    "/Cargo.toml",
    "/examples/*",
    "/proto/*",
    "/README.md",
    "/src/*",
    "/up-spec/up-core-api/uprotocol/*",
]
keywords = ["uProtocol", "SDK", "communication"]
license = "Apache-2.0"
name = "up-rust"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-rust"
rust-version = "1.88"
version = "0.10.0-SNAPSHOT"
resolver = "2"

[features]
default = []
cloudevents = ["protobuf-support"]
communication = [
    "up-l2-notifier",
    "up-l2-publisher",
    "up-l2-subscriber",
    "up-l2-rpc-client",
    "up-l2-rpc-server",
]
protobuf-support = ["dep:protobuf"]
symphony = ["up-l2-rpc-server", "dep:serde", "dep:serde_json", "dep:symphony"]
test-util = ["dep:mockall"]
up-core-api = ["protobuf-support"]
# Hard-renamed from up-core-types: this gates the generated up_core_api module,
# not the unconditional core types.
transport-implementer-api = ["selected-wire-transport-core"]
selected-wire-transport-core = ["selected-wire-codec-core"]
selected-wire-transport-adapter = ["selected-wire-transport-core"]
selected-wire-codec-core = []
wire-implementer-api = ["selected-wire-codec-core"]
selected-wire-user-api = ["selected-wire-transport-adapter", "up-core-api"]
protobuf-wire = ["up-core-api"]
owned-frame-transport = ["selected-wire-transport-core", "up-core-api"]
communication-api = []
# Hard-renamed from up-l2-api to match the communication layer's name.
up-l2-notifier = ["communication-api"]
up-l2-publisher = ["communication-api"]
up-l2-subscriber = ["communication-api", "usubscription"]
up-l2-rpc-client = ["communication-api", "up-core-api", "tokio/sync", "tokio/time"]
up-l2-rpc-server = ["communication-api", "up-core-api", "tokio/sync", "tokio/time"]
udiscovery = ["up-l2-rpc-client"]
usubscription = ["up-l2-rpc-client"]
util = ["tokio/sync"]

[dependencies]
async-trait = { version = "0.1.92" }
bytes = { version = "1.12.1" }
# prevent usage of yanked 0.10.1 version of chacha20
chacha20 = { version = "0.10.2" }
fluent-uri = { version = "0.4.1", features = ["net"] }
mediatype = "0.23.0"
mockall = { version = "0.15.0", optional = true }
protobuf = { version = "3.7.2", features = ["with-bytes"], optional = true }
rand = { version = "0.10.3" }
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.150", optional = true }
symphony = { version = "0.1.5", optional = true }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["log", "std"] }
uuid-simd = { version = "0.8.0", default-features = false, features = ["std", "detect"] }

[build-dependencies]
protobuf-codegen = { version = "3.7.2" }
protoc-bin-vendored = { version = "3.2" }

[dev-dependencies]
clap = { version = "4.6.6" }
# addresses RUSTSEC-2026-0204
crossbeam-epoch = { version = "0.9.20" }
cucumber = { version = "0.23.0", features = ["output-junit"] }
hex = { version = "0.4.3" }
junit-report = { version = "0.9.1" }
mockall = { version = "0.15.0" }
pretty_assertions = { version = "1.4" }
proptest = { version = "=1.5.0" }
test-case = { version = "3.3.1" }
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-all-features]
denylist = ["test-util"]
skip_feature_sets = [
    # the features on the left side include the features on the right side,
    # so there is no need to test them together
    ["up-core-api", "protobuf-support"],
    ["cloudevents", "protobuf-support"],
    ["symphony", "up-l2-rpc-server"],
    ["symphony", "communication-api"],
    ["communication", "up-l2-notifier"],
    ["communication", "up-l2-publisher"],
    ["communication", "up-l2-subscriber"],
    ["communication", "up-l2-rpc-client"],
    ["communication", "up-l2-rpc-server"],
    ["communication", "communication-api"],
    ["communication", "up-core-api"],
    ["communication", "protobuf-support"],
    ["communication", "usubscription"],
    ["up-l2-notifier", "communication-api"],
    ["up-l2-publisher", "communication-api"],
    ["up-l2-subscriber", "communication-api"],
    ["up-l2-subscriber", "usubscription"],
    ["up-l2-subscriber", "up-l2-rpc-client"],
    ["up-l2-subscriber", "up-core-api"],
    ["up-l2-rpc-client", "communication-api"],
    ["up-l2-rpc-client", "up-core-api"],
    ["up-l2-rpc-client", "protobuf-support"],
    ["up-l2-rpc-server", "communication-api"],
    ["up-l2-rpc-server", "up-core-api"],
    ["up-l2-rpc-server", "protobuf-support"],
    ["usubscription", "up-l2-rpc-client"],
    ["usubscription", "communication-api"],
    ["usubscription", "up-core-api"],
    ["usubscription", "protobuf-support"],
    ["udiscovery", "up-l2-rpc-client"],
    ["udiscovery", "communication-api"],
    ["udiscovery", "up-core-api"],
    ["udiscovery", "protobuf-support"],
]
# optional dependencies are activated by means of features only
skip_optional_dependencies = true
max_combination_size = 3

[[example]]
name = "simple_notify"
required-features = ["up-l2-notifier", "util"]

[[example]]
name = "simple_publish"
required-features = ["up-l2-publisher", "protobuf-support", "util"]

[[example]]
name = "simple_rpc"
required-features = ["up-l2-rpc-client", "up-l2-rpc-server", "util"]

[[example]]
name = "symphony_target"
required-features = ["symphony", "up-l2-rpc-client", "up-l2-rpc-server", "util"]

[[test]]
name = "tck_uuri"
harness = false                       # allows Cucumber to print output instead of libtest
required-features = ["up-core-api"]

[[test]]
name = "tck_uuid"
harness = false                       # allows Cucumber to print output instead of libtest
required-features = ["up-core-api"]

[lints.rust]
# Every public item is documented and every public type is inspectable.
# Copy is a per-type semver commitment, not a crate-wide hygiene default.
missing_docs = "deny"
missing_debug_implementations = "deny"
# this prevents cargo from complaining about code blocks
# excluded from tarpaulin coverage checks
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)', 'cfg(feature, values("zero-copy-transport"))'] }

[lints.clippy]
# see https://corrode.dev/blog/defensive-programming/#clippy-lints-for-defensive-programming
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "allow"

[[test]]
name = "wire_metadata_conformance"
required-features = ["wire-implementer-api", "up-core-api"]

[[test]]
name = "wire_metadata_golden"
required-features = ["wire-implementer-api", "up-core-api"]
