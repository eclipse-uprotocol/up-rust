# Comprehensive combination of checks, linting, feature-checks, testing to be run on merge and on PR
# Upload test results for potential re-use in publication workflow, returns the corresponding download
# URL as an output on workflow_call

name: Default checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "examples/**"
      - "src/**"
      - "tests/**"
      - "Cargo.*"
      - "build.rs"
      - "deny.toml"
  workflow_call:
    outputs:
      test_results_url:
        description: "URL of the test results artifact"
        value: ${{ jobs.test.outputs.test_results_url }}
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read # needed for checking out the code

env:
  RUST_TOOLCHAIN: ${{ vars.RUST_TOOLCHAIN || 'stable' }}
  CARGO_DENY_VERSION: 0.20.2
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Restore cargo-deny cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: |
          case "${RUNNER_ARCH}" in
            X64)
              asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
              sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
              ;;
            ARM64)
              asset="cargo-deny-${CARGO_DENY_VERSION}-aarch64-unknown-linux-musl.tar.gz"
              sha256="995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d"
              ;;
            *)
              echo "Unsupported runner architecture: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac
          archive_dir="${HOME}/.cache/cargo-deny"
          archive_path="${archive_dir}/${asset}"

          mkdir -p "${archive_dir}" "${HOME}/.cargo/bin"

          if [ ! -f "${archive_path}" ]; then
            curl --proto '=https' --tlsv1.2 --silent --show-error --location \
              --output "${archive_path}" \
              "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}"
          fi

          echo "${sha256}  ${archive_path}" | sha256sum -c -
          tar -xzf "${archive_path}" -C "${HOME}/.cargo/bin" --strip-components=1 "${asset%.tar.gz}/cargo-deny"
          cargo deny --version | grep -Fxq "cargo-deny ${CARGO_DENY_VERSION}"
      - name: Run cargo deny
        run: cargo deny check --all-features

  # [impl->req~up-language-ci-build~1]
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Run cargo check
        run: |
          cargo check --workspace --all-targets --all-features

  # [impl->req~up-language-ci-linter~1]
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Run cargo fmt
        run: |
          cargo fmt --all --check

  # [impl->req~up-language-ci-linter~1]
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Run cargo clippy
        run: |
          cargo clippy --version
          cargo clippy --all-targets --all-features --no-deps -- -W warnings -D warnings

  # [impl->req~up-language-ci-api-docs~1]
  docu:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Run rustdoc
        run: |
          cargo doc --no-deps --all-features

  check-links:
    # check links contained in markdown, asciidoc and source code files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--cache --max-cache-age 1d --verbose --no-progress --exclude-path './target/' --exclude-path './up-spec/' -- './**/*.md' './**/*.rs'"

  feature-check:
    # Comprehensive check for feature flag combinations, excluding development dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: "v0.6.45"
          GH_TOKEN: ${{ github.token }}
        run: |
          # See https://github.com/taiki-e/cargo-hack#from-prebuilt-binaries
          # Get host target.
          host=$(rustc -vV | grep '^host:' | cut -d' ' -f2)
          # Download binary.
          curl --proto '=https' --tlsv1.2 -fsSL -o cargo-hack.tar.gz "https://github.com/taiki-e/cargo-hack/releases/download/${CARGO_HACK_VERSION}/cargo-hack-${host}.tar.gz"
          # Verify release attestations.
          gh release -R https://github.com/taiki-e/cargo-hack verify-asset cargo-hack.tar.gz
          # Verify artifact attestations.
          gh attestation verify --repo taiki-e/cargo-hack --signer-workflow taiki-e/github-actions/.github/workflows/rust-release.yml cargo-hack.tar.gz
          # Install to $CARGO_HOME/bin (or $HOME/.cargo/bin if CARGO_HOME is unset).
          tar xf cargo-hack.tar.gz -C "${CARGO_HOME:-"$HOME/.cargo"}"/bin
          # Remove archive.
          rm cargo-hack.tar.gz
      - name: Run cargo hack powerset
        run: |
          cargo hack check \
            --no-dev-deps \
            --feature-powerset \
            --group-features communication,usubscription,udiscovery,symphony \
            --depth 2

  # [impl->req~up-language-ci-test~1]
  test:
    # Subset of feature-combos, on only one OS - more complete testing in test-featurematrix.yaml
    outputs:
      test_results_url: ${{ steps.test_results.outputs.artifact-url }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature-flags:
          [
            "",
            "--features protobuf-support,up-l2-api",
            "--all-features",
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run lib tests
        env:
          # needed to run tests on the stable toolchain, as some of the tests use unstable features
          RUSTC_BOOTSTRAP: 1
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/target
          cargo test --no-fail-fast --lib ${{ matrix.feature-flags }} -- \
            -Z unstable-options \
            --format junit \
            --report-time \
            > ${GITHUB_WORKSPACE}/target/lib-test-results.xml
      - name: Run doc tests
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/target
          cargo test --no-fail-fast --doc ${{ matrix.feature-flags }} -- \
            -Z unstable-options \
            --format junit \
            --report-time \
              > ${GITHUB_WORKSPACE}/target/doc-test-results.xml
      - name: Run TCK tests
        if: matrix.feature-flags == '--all-features'
        run: |
          # the Cucumber based tests write a results file in JUnit format to "tck-[test_name]-results.xml"
          cargo test --no-fail-fast --test 'tck_*' ${{ matrix.feature-flags }} -- \
          --junit-out-folder=${GITHUB_WORKSPACE}/target

      - name: Upload all-features test results artifact
        id: test_results
        # prevent execution when running the workflow locally with act
        if: matrix.feature-flags == '--all-features' && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          # include all test result files
          path: target/*-results.xml
