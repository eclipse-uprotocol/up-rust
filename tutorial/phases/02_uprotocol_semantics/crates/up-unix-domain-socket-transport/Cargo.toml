[package]
name = "up-unix-domain-socket-transport"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
up-frame-codec = { path = "../up-frame-codec" }
up-rust = "0.9.0"
tokio = { version = "1.52.3", features = ["net", "io-util", "rt", "macros", "sync"] }
async-trait = "0.1"
protobuf = "3.7.2"
anyhow = "1.0"

[dev-dependencies]
up-rust = { version = "0.9.0", features = ["test-util"] }
